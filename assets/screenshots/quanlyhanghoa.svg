<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Grid decoration -->
  <circle cx="680" cy="80" r="140" fill="#3b82f6" opacity="0.15" filter="blur(60px)" />
  <circle cx="120" cy="420" r="160" fill="#10b981" opacity="0.12" filter="blur(70px)" />

  <!-- Phone Mockup Container -->
  <g transform="translate(260, 30)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="280" height="440" rx="36" fill="#0b0f19" stroke="#334155" stroke-width="4" />
    <rect x="90" y="10" width="100" height="18" rx="9" fill="#1e293b" />

    <!-- Screen Content -->
    <rect x="12" y="36" width="256" height="392" rx="24" fill="#0f172a" />

    <!-- App Header -->
    <rect x="24" y="52" width="150" height="16" rx="4" fill="#38bdf8" />
    <rect x="24" y="74" width="90" height="10" rx="3" fill="#64748b" />
    <circle cx="240" cy="62" r="14" fill="#1e293b" />
    <text x="240" y="66" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">📱</text>

    <!-- Stat Cards -->
    <rect x="24" y="96" width="110" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="34" y="116" fill="#94a3b8" font-family="sans-serif" font-size="10">Doanh Thu Hôm Nay</text>
    <text x="34" y="140" fill="#22c55e" font-family="sans-serif" font-size="14" font-weight="bold">8.450.000đ</text>

    <rect x="146" y="96" width="110" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="156" y="116" fill="#94a3b8" font-family="sans-serif" font-size="10">Đơn Đã Bán</text>
    <text x="156" y="140" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">24 Đơn</text>

    <!-- Items List -->
    <rect x="24" y="170" width="232" height="42" rx="8" fill="#1e293b" />
    <circle cx="44" cy="191" r="12" fill="#3b82f6" />
    <text x="64" y="188" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Cà phê Arabica Cầu Đất</text>
    <text x="64" y="202" fill="#94a3b8" font-family="sans-serif" font-size="9">Kho: 45 gói • 185.000đ</text>

    <rect x="24" y="220" width="232" height="42" rx="8" fill="#1e293b" />
    <circle cx="44" cy="241" r="12" fill="#10b981" />
    <text x="64" y="238" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Trà Ô Long Thượng Hạng</text>
    <text x="64" y="252" fill="#94a3b8" font-family="sans-serif" font-size="9">Kho: 12 gói • 240.000đ</text>

    <rect x="24" y="270" width="232" height="42" rx="8" fill="#1e293b" />
    <circle cx="44" cy="291" r="12" fill="#f59e0b" />
    <text x="64" y="288" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Syrup Hạt Dẻ Béo Ngậy</text>
    <text x="64" y="302" fill="#94a3b8" font-family="sans-serif" font-size="9">Kho: 8 chai • 120.000đ</text>

    <!-- Cloud Sync Indicator -->
    <rect x="24" y="324" width="232" height="34" rx="8" fill="#065f46" opacity="0.4" stroke="#10b981" stroke-width="1" />
    <text x="140" y="346" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">☁️ Vercel KV Sync: Đã kết nối</text>

    <!-- Bottom Nav -->
    <rect x="12" y="380" width="256" height="48" fill="#0b0f19" />
    <circle cx="60" cy="402" r="6" fill="#38bdf8" />
    <circle cx="140" cy="402" r="16" fill="#3b82f6" />
    <text x="140" y="407" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">+</text>
    <circle cx="220" cy="402" r="6" fill="#64748b" />
  </g>

  <!-- Side Badge Left -->
  <g transform="translate(60, 180)" filter="url(#shadow)">
    <rect width="160" height="90" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="36" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">📱 Mobile-First PWA</text>
    <text x="20" y="58" fill="#94a3b8" font-family="sans-serif" font-size="10">Dùng mượt trên Safari,</text>
    <text x="20" y="74" fill="#94a3b8" font-family="sans-serif" font-size="10">Chrome iOS &amp; Android</text>
  </g>

  <!-- Side Badge Right -->
  <g transform="translate(580, 220)" filter="url(#shadow)">
    <rect width="160" height="90" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="36" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">⚡ Đồng Bộ Đa Thiết Bị</text>
    <text x="20" y="58" fill="#94a3b8" font-family="sans-serif" font-size="10">Quét mã QR kết nối tức thì,</text>
    <text x="20" y="74" fill="#94a3b8" font-family="sans-serif" font-size="10">bán hàng đa kênh mượt mà</text>
  </g>
</svg>
